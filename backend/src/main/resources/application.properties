# Nome dell'applicazione
spring.application.name=backend

# Database H2 in memoria (si azzera ad ogni riavvio)
# memoria solo nelle RAM
spring.datasource.url=jdbc:h2:mem:taskdb 
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate creare e aggiorna automaticamente le tabelle
spring.jpa.hibernate.ddl-auto=update
#stampa i log delle query SQL 
spring.jpa.show-sql=true

# Sicurezza JWT
# Chiave segreta per firmare i token (in produzione andrebbe tenuta fuori dal codice)
app.jwt.secret=cambiaQuestaChiaveConUnaStringaMoltoLungaAlmeno32Byte!!
# Durata del token in millisecondi (qui 24 ore)
app.jwt.expiration=86400000